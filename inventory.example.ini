# Inventario de ejemplo. Copiar a inventory.ini (ignorado por git) y editar:
#   cp inventory.example.ini inventory.ini
#
# IPs de documentacion (RFC 5737). Reemplazar por las de tu red.
#
# El playbook se corre como root desde uno de los nodos PVE. A ese nodo
# agregale ansible_connection=local en su linea; al resto se llega por SSH.
#
# El PBS no va en el inventario: corre como CT en uno de estos nodos
# (pbs_host_node en group_vars/all.yml) y se opera con `pct exec`.

[pve_nodes]
pve1 ansible_host=192.0.2.11 ansible_connection=local
pve2 ansible_host=192.0.2.12
pve3 ansible_host=192.0.2.13

[all:vars]
ansible_user=root
