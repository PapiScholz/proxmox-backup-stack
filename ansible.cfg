[defaults]
# Inventario real del usuario (ignorado por git). Partir de inventory.example.ini:
#   cp inventory.example.ini inventory.ini
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

# host_key_checking = False: los nodos PVE/PBS de un cluster se reinstalan y
# regeneran sus host keys con frecuencia, y el nodo de control ya confia en ellos
# via el cluster (/etc/pve/priv/known_hosts). Si tu red no es de confianza,
# ponelo en True y carga las keys con ssh-keyscan antes de la primera corrida.
host_key_checking = False

[ssh_connection]
pipelining = True
